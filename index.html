<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEF1; --surface:#fff; --ink:#16202A; --muted:#64717E; --line:#D8DEE4;
  --green:#17A058; --green-soft:#D6F0E1; --amber:#E7A53A; --amber-soft:#FBEBCF;
  --red:#CF4B45; --red-soft:#F7DDDB;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:18px;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
.muted{color:var(--muted)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand b{font:800 20px var(--display);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:220px;border:0;background:none;border-radius:12px;padding:10px 6px;font:700 14px var(--display);color:var(--muted)}
nav.tabs button.on{background:var(--ink);color:#fff}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel-head .tot{font:600 13px var(--display);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:700 14px var(--display);background:var(--ink);color:#fff}
.btn.alt{background:#E6EAEE;color:var(--ink)}
.btn.go{background:var(--green)}
.btn.stop{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;line-height:1}
.icon.sm{width:32px;height:32px;font-size:13px}
.icon.danger{color:var(--red)}
.in,select.in{border:1px solid var(--line);background:#F7F9FA;border-radius:10px;padding:9px 11px;min-width:0;width:100%}

/* day header */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayhead .mid{flex:1;min-width:0}
.banner{margin-top:12px;border-radius:14px;padding:12px 14px;font:700 15px var(--display);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}

.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;margin-top:8px}

.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}

/* setup */

@media(prefers-reduced-motion:no-preference){.check,.bar span{transition:background .15s,width .25s}}

<body>
<div class="auth hidden" id="auth">
  <div>
    <h1>📖 Tally</h1>
    <p>Set daily goals for your classes, workouts and calories. Check them off and watch the green days stack up.</p>
    <button class="btn go" data-act="signIn">Sign in with Google</button>
  </div>
</div>

<div class="wrap">
  <div class="brand"><b>📖 Tally</b><span id="modeNote"></span></div>
  <div id="view"><p class="muted">Loading…</p></div>
</div>

<nav class="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="calendar">Calendar</button>
  <button data-act="tab" data-tab="setup">Setup</button>
</nav>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
/* ============================================================
   1. FIREBASE CONFIG lives in firebase-config.js (same folder as this file).
   Keeping it separate means updating index.html never overwrites your keys.
   ============================================================ */
let FIREBASE_CONFIG = { apiKey: "YOUR_API_KEY" }, CONFIG_STATUS = "missing";
try { ({ FIREBASE_CONFIG } = await import("./firebase-config.js")); CONFIG_STATUS = "loaded"; }
catch (e) { console.warn("Could not load firebase-config.js, running in local mode.", e); }
const IS_FB = !!FIREBASE_CONFIG?.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
const LOCAL_WHY = CONFIG_STATUS === "missing" ? "firebase-config.js not found" : "apiKey not set in firebase-config.js";

/* ============================================================
   2. Helpers
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
const todayStr = () => dstr(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = o => JSON.parse(JSON.stringify(o));
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const COLORS = ["#3B6FD8", "#7A5AF0", "#12A3A3", "#C23B8A", "#C79A12", "#5B6B7B", "#2D4A9E", "#6FA21B"];
const CHECK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.6 3.6 7.4-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const hm = s => { if (!s) return null; const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmtTime = m => { const h = Math.floor(m / 60) % 24, mm = m % 60; return `${((h + 11) % 12) + 1}:${pad(mm)} ${h >= 12 ? "PM" : "AM"}`; };
const round5 = n => Math.max(5, Math.round(n / 5) * 5);
const daysUntil = (to, from) => Math.round((parse(to) - parse(from)) / 864e5);
function examBoost(exam, ds) {
  if (!exam) return 1; const n = daysUntil(exam, ds);
  return n < 0 ? 1 : n <= 3 ? 2.5 : n <= 7 ? 2 : n <= 14 ? 1.5 : 1;
}
const longDate = ds => parse(ds).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
const shortDate = ds => parse(ds).toLocaleDateString("en-US", { month: "short", day: "numeric" });

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600);
}

/* ============================================================
   3. Storage adapters (Firestore or localStorage)
   Data layout:  users/{uid}/meta/settings   and   users/{uid}/days/{YYYY-MM-DD}
   ============================================================ */
const guard = p => Promise.resolve(p).catch(e => { console.error(e); toast("Sync failed. Check your Firestore rules."); });
let store;
if (IS_FB) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [A, Au, F] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app), db = F.getFirestore(app);
  let user = null;
  store = {
    mode: "firebase",
    onAuth: cb => Au.onAuthStateChanged(auth, u => { user = u; cb(u); }),
    signIn: () => guard(Au.signInWithPopup(auth, new Au.GoogleAuthProvider())),
    signOut: () => Au.signOut(auth),
    start(onS, onD) {
      const a = F.onSnapshot(F.doc(db, "users", user.uid, "meta", "settings"), s => onS(s.exists() ? s.data() : null));
      const b = F.onSnapshot(F.collection(db, "users", user.uid, "days"), snap => {
        const m = {}; snap.forEach(d => { m[d.id] = d.data(); }); onD(m);
      });
      return () => { a(); b(); };
    },
    saveSettings: p => guard(F.setDoc(F.doc(db, "users", user.uid, "meta", "settings"), clean(p), { mergeFields: Object.keys(p) })),
    saveDay: (ds, data) => guard(F.setDoc(F.doc(db, "users", user.uid, "days", ds), clean(data))),
    email: () => user?.email || ""
  };
} else {
  const LS = "tally.v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || { settings: null, days: {} }; } catch { return { settings: null, days: {} }; } };
  const save = d => localStorage.setItem(LS, JSON.stringify(d));
  store = {
    mode: "local",
    start(onS, onD) { const d = load(); onS(d.settings); onD(d.days); return () => {}; },
    saveSettings(p) { const d = load(); d.settings = { ...(d.settings || {}), ...clean(p) }; save(d); },
    saveDay(ds, data) { const d = load(); d.days[ds] = clean(data); save(d); },
    email: () => ""
  };
}

/* ============================================================
   4. State
   ============================================================ */
const defaultSettings = () => ({
  classes: [], dailyBudget: 180, startDate: todayStr(),
  studyStart: "16:00", breakMin: 10, examBoost: true, summaryEmail: "",
  study: { enabled: true },
  workout: { enabled: true, plan: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map(i => [i, { label: "Workout", minutes: 0 }])) },
  calories: { enabled: true, limit: 2200, limits: {} },
  timer: null
});
const mergeSettings = r => {
  const d = defaultSettings(); if (!r) return d;
  const wk = { ...d.workout, ...r.workout };
  if (!r.workout?.plan) { wk.plan = {}; (r.workout?.days || [0, 1, 2, 3, 4, 5, 6]).forEach(i => { wk.plan[i] = { label: "Workout", minutes: 0 }; }); }
  const cal = { ...d.calories, ...r.calories }; cal.limits = cal.limits || {};
  return { ...d, ...r, study: { ...d.study, ...r.study }, workout: wk, calories: cal, classes: r.classes || [] };
};
const S = {
  tab: "today", selDate: todayStr(), cal: { mode: "month", cursor: todayStr() },
  settings: defaultSettings(), bulk: { wk: [], cal: [] }, days: {}, loaded: { s: false, d: false }, seeded: false, unsub: null
};
const classById = id => S.settings.classes.find(c => c.id === id);

/* ============================================================
   5. Day model + status
   ============================================================ */
function makeSnap(ds) {
  const dow = parse(ds).getDay(), st = S.settings, plan = {}, list = [];
  if (st.study.enabled) for (const c of st.classes) if (c.days.includes(dow) && c.minutes > 0) {
    const b = st.examBoost !== false ? examBoost(c.exam, ds) : 1;
    list.push({ c, goal: b > 1 ? round5(c.minutes * b) : c.minutes, boosted: b > 1, start: hm(c.start) });
  }
  const br = st.breakMin ?? 10, pinned = list.filter(x => x.start != null);
  let cur = hm(st.studyStart);
  if (cur != null) for (const x of list.filter(x => x.start == null).sort((a, b) => b.c.priority - a.c.priority)) {
    for (let moved = true; moved;) {
      moved = false;
      for (const q of pinned) if (cur < q.start + q.goal + br && cur + x.goal + br > q.start) { cur = q.start + q.goal + br; moved = true; }
    }
    x.start = cur; cur += x.goal + br;
  }
  for (const x of list) plan[x.c.id] = { name: x.c.name, color: x.c.color, goal: x.goal, start: x.start ?? null, exam: x.c.exam || "", boosted: x.boosted };
  return { plan, workout: st.workout.enabled && st.workout.plan?.[dow] ? { ...st.workout.plan[dow] } : false, cal: st.calories.enabled, limit: st.calories.limits?.[dow] ?? st.calories.limit };
}
const newDay = ds => ({ date: ds, snap: makeSnap(ds), done: {}, sessions: [], workout: { done: false, note: "" }, cal: { entries: [], ok: false } });
function dayView(ds) {
  const d = S.days[ds];
  return {
    snap: d?.snap || makeSnap(ds), done: d?.done || {}, sessions: d?.sessions || [],
    workout: d?.workout || { done: false, note: "" }, cal: d?.cal || { entries: [], ok: false }
  };
}
const calTotal = v => v.cal.entries.reduce((a, e) => a + e.kcal, 0);
const loggedMin = (v, id) => v.sessions.filter(s => s.classId === id).reduce((a, s) => a + s.sec, 0) / 60;
function status(ds) {
  const v = dayView(ds), ids = Object.keys(v.snap.plan);
  const study = ids.length ? ids.every(id => v.done[id]) : null;
  const workout = v.snap.workout ? !!v.workout.done : null;
  const cal = v.snap.cal ? (v.cal.entries.length ? calTotal(v) <= v.snap.limit : !!v.cal.ok) : null;
  const arr = [study, workout, cal].filter(x => x !== null);
  const level = !arr.length ? "na" : arr.every(Boolean) ? "full" : arr.some(Boolean) ? "part" : "none";
  return { study, workout, cal, level, done: arr.filter(Boolean).length, total: arr.length };
}
function startDateStr() {
  let s = S.settings.startDate || todayStr();
  for (const k of Object.keys(S.days)) if (k < s) s = k;
  return s;
}
function streak(key) {
  const t = todayStr(); let d = startDateStr(), run = 0, best = 0;
  while (d <= t) {
    const st = status(d);
    const val = key === "all" ? (st.level === "na" ? null : st.level === "full") : st[key];
    if (val !== null) { if (val) { run++; if (run > best) best = run; } else if (d !== t) run = 0; }
    d = addDays(d, 1);
  }
  return { cur: run, best };
}
function periodStats(dates) {
  const t = todayStr(), s = startDateStr(); let full = 0, tracked = 0;
  for (const d of dates) { if (d > t || d < s) continue; const st = status(d); if (st.level === "na") continue; tracked++; if (st.level === "full") full++; }
  return { full, tracked };
}

async function updateDay(ds, fn) {
  const cur = S.days[ds] ? structuredClone(S.days[ds]) : newDay(ds);
  fn(cur);
  S.days[ds] = cur; render();
  await store.saveDay(ds, cur);
}
function addSession(d, s) {
  d.sessions.push({ id: uid(), ...s });
  const goal = d.snap.plan[s.classId]?.goal;
  const sec = d.sessions.filter(x => x.classId === s.classId).reduce((a, x) => a + x.sec, 0);
  if (goal && sec / 60 >= goal) d.done[s.classId] = true;
}
function commitSettings(partial) {
  Object.assign(S.settings, partial);
  store.saveSettings(partial);
  const t = todayStr();
  if (S.days[t]) updateDay(t, d => { d.snap = makeSnap(t); }); else render();
}

/* ============================================================
   6. Timer
   ============================================================ */
function startTimer(classId) {
  if (S.settings.timer || !classId) return;
  S.settings.timer = { classId, start: Date.now() };
  store.saveSettings({ timer: S.settings.timer }); render();
}
async function stopTimer() {
  const t = S.settings.timer; if (!t) return;
  const sec = Math.round((Date.now() - t.start) / 1000);
  S.settings.timer = null; store.saveSettings({ timer: null });
  document.title = "Tally";
  if (sec < 10) { toast("Under 10 seconds, so nothing was logged"); render(); return; }
  await updateDay(dstr(new Date(t.start)), d => addSession(d, { classId: t.classId, start: t.start, sec }));
  toast(`Logged ${fmtMin(sec / 60)}`);
}
setInterval(() => {
  const t = S.settings.timer; if (!t) return;
  const txt = fmtClock(Date.now() - t.start);
  const el = $("#timerClock"); if (el) el.textContent = txt;
  document.title = `${txt} · Tally`;
}, 1000);

/* ============================================================
   7. Rendering
   ============================================================ */
function render() {
  if (!S.loaded.s || !S.loaded.d) return;
  const keep = {}; document.querySelectorAll("[data-keep]").forEach(el => { if (el.id) keep[el.id] = el.value; });
  const ae = document.activeElement;
  const aid = ae && ae.id && ae.hasAttribute("data-keep") ? ae.id : null;
  const sel = aid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;

  $("#view").innerHTML = S.tab === "today" ? renderToday() : S.tab === "calendar" ? renderCalendar() : renderSetup();

  for (const [id, val] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = val; }
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(...sel); } catch { } } }
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  $("#modeNote").textContent = store.mode === "local" ? `Local mode (${LOCAL_WHY}): saved in this browser only` : "";
}

function blockLine(p, ds) {
  let t = p.start != null ? `${fmtTime(p.start)} – ${fmtTime(p.start + p.goal)}` : "";
  if (p.boosted) t += `${t ? " · " : ""}goal raised for exam`;
  let badge = "";
  if (p.exam) { const n = daysUntil(p.exam, ds); if (n >= 0) badge = `<span class="badge">Exam ${n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"}</span>`; }
  return t || badge ? `<div class="blk">${t}${badge}</div>` : "";
}
/* ---------- Today ---------- */
function renderToday() {
  const ds = S.selDate, t = todayStr(), isToday = ds === t, v = dayView(ds), st = status(ds), s = S.settings;
  const title = isToday ? "Today" : ds === addDays(t, -1) ? "Yesterday" : DOW[parse(ds).getDay()];
  const sAll = streak("all");
  let msg = st.level === "full" ? "All goals done" : st.level === "na" ? "No goals set for this day" : `${st.done} of ${st.total} goals done`;
  let h = `<div class="dayhead">
    <button class="icon" data-act="prevDay" aria-label="Previous day">‹</button>
    <div class="mid" style="text-align:center"><h1>${title}</h1><p class="sub">${longDate(ds)}</p></div>
    <button class="icon" data-act="nextDay" ${isToday ? "disabled" : ""} aria-label="Next day">›</button></div>
    <div class="banner ${st.level}"><span>${msg}</span><small>${sAll.cur} day streak · best ${sAll.best}</small></div>`;
  if (!isToday) h += `<p style="text-align:center;margin:10px 0 0"><button class="btn alt sm" data-act="goToday">Back to today</button></p>`;

  /* study */
  const ids = Object.keys(v.snap.plan).sort((a, b) => (v.snap.plan[a].start ?? 1e9) - (v.snap.plan[b].start ?? 1e9)), t0 = s.timer;
  const planMin = ids.reduce((a, id) => a + v.snap.plan[id].goal, 0);
  const planLogged = ids.reduce((a, id) => a + loggedMin(v, id), 0);
  h += `<section class="panel"><div class="panel-head"><h2>Study</h2>${ids.length ? `<span class="tot">${fmtMin(planLogged)} of ${fmtMin(planMin)}</span>` : ""}</div>`;
  if (!s.classes.length) {
    h += `<p class="empty">Add your classes in Setup and Tally builds a daily study plan.</p>`;
  } else {
    if (t0) {
      const c = classById(t0.classId);
      h += `<div class="timer running"><div class="tlabel">Studying ${esc(c?.name || "class")}</div><div class="clock" id="timerClock">${fmtClock(Date.now() - t0.start)}</div><button class="btn stop" data-act="stopTimer">Stop and log</button></div>`;
    } else {
      const first = ids[0] || s.classes[0].id;
      h += `<div class="timer"><div class="clock idle">0:00</div>
        <select class="in" id="timerClass" data-keep aria-label="Class to time">${s.classes.map(c => `<option value="${c.id}" ${c.id === first ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        <button class="btn go" data-act="startTimerSel">Start timer</button></div>`;
    }
    if (!ids.length) h += `<p class="empty">No classes scheduled for ${DOW[parse(ds).getDay()]}. You can still time a session above.</p>`;
    h += ids.map(id => {
      const p = v.snap.plan[id], logged = loggedMin(v, id), pct = Math.min(100, logged / p.goal * 100), done = !!v.done[id];
      return `<div class="row ${done ? "done" : ""}">
        <button class="check ${done ? "on" : ""}" data-act="toggleClass" data-id="${id}" aria-pressed="${done}" aria-label="Mark ${esc(p.name)} done">${CHECK}</button>
        <div class="rowmain"><div class="rname"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</div>${blockLine(p, ds)}
          <div class="bar"><span style="width:${pct}%;background:${p.color}"></span></div></div>
        <div class="rmeta">${fmtMin(logged)} / ${fmtMin(p.goal)}</div>
        <button class="icon sm" data-act="playClass" data-id="${id}" ${t0 ? "disabled" : ""} aria-label="Start timer for ${esc(p.name)}">▶</button>
        <button class="icon sm" data-act="addMin" data-id="${id}" aria-label="Add minutes to ${esc(p.name)}">+</button></div>`;
    }).join("");
    if (v.sessions.length) {
      h += `<details><summary>Sessions logged (${v.sessions.length})</summary>${v.sessions.map(x => {
        const c = classById(x.classId);
        const when = x.manual ? "added" : new Date(x.start).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        return `<div class="sess"><span>${when}</span><span class="grow">${esc(c?.name || "Class")}</span><span>${fmtMin(x.sec / 60)}</span>
          <button class="icon sm danger" data-act="delSession" data-id="${x.id}" aria-label="Delete session">×</button></div>`;
      }).join("")}</details>`;
    }
  }
  h += `</section>`;

  /* workout */
  if (s.workout.enabled) {
    h += `<section class="panel"><div class="panel-head"><h2>Workout</h2></div>`;
    const wp = v.snap.workout && typeof v.snap.workout === "object" ? v.snap.workout : { label: "Workout", minutes: 0 };
    if (!v.snap.workout) h += `<p class="empty">Rest day.</p>`;
    else h += `<div class="row"><button class="check big ${v.workout.done ? "on" : ""}" data-act="toggleWorkout" aria-pressed="${!!v.workout.done}" aria-label="Mark workout done">${CHECK}</button>
      <div class="rowmain"><div class="rname">${esc(wp.label || "Workout")}</div><div class="blk">${wp.minutes ? wp.minutes + " min goal" : "No time goal"}${v.workout.done ? " · done" : ""}</div></div></div>
      <input class="in" id="wkNote" data-keep data-chg="workoutNote" placeholder="What did you do? (optional)" value="${esc(v.workout.note)}">`;
    h += `</section>`;
  }

  /* calories */
  if (v.snap.cal) {
    const tot = calTotal(v), lim = v.snap.limit, over = tot > lim, pct = lim ? Math.min(100, tot / lim * 100) : 100;
    const calFoot = v.cal.entries.length
      ? `<p class="calstatus ${over ? "over" : "ok"}">${over ? `Over your limit by ${tot - lim} kcal. This goal is not met.` : "Under your limit. This goal counts as met."}</p>`
      : `<div class="row" style="margin-top:8px"><button class="check big ${v.cal.ok ? "on" : ""}" data-act="toggleCalOk" aria-pressed="${!!v.cal.ok}" aria-label="Stayed under limit">${CHECK}</button>
        <div class="rowmain"><div class="rname">Stayed under my limit</div><div class="blk">Or add meals above and Tally checks it for you.</div></div></div>`;
    h += `<section class="panel"><div class="panel-head"><h2>Calories</h2><span class="tot">${over ? `${tot - lim} over` : `${lim - tot} left`}</span></div>
      <div class="calnum ${over ? "over" : ""}">${tot} <small>of ${lim} kcal</small></div>
      <div class="bar"><span style="width:${pct}%;background:${over ? "var(--red)" : "var(--green)"}"></span></div>
      <div class="addrow"><input class="in" id="calLabel" data-keep placeholder="Meal (optional)"><input class="in" id="calKcal" data-keep inputmode="numeric" placeholder="kcal">
        <button class="btn sm" data-act="addCal">Add</button></div>
      ${v.cal.entries.map(e => `<div class="sess"><span class="grow" style="width:auto">${esc(e.label || "Entry")}</span><span>${e.kcal}</span>
        <button class="icon sm danger" data-act="delCal" data-id="${e.id}" aria-label="Delete entry">×</button></div>`).join("")}
      ${calFoot}</section>`;
  }
  return h;
}

/* ---------- Calendar ---------- */
function dayCell(ds, inMonthDay) {
  const t = todayStr(), s0 = startDateStr(), st = status(ds);
  const future = ds > t, before = ds < s0;
  const cls = future ? "future" : before ? "before" : st.level === "na" ? "" : st.level;
  const pips = (!future && !before) ? ["study", "workout", "cal"].filter(k => st[k] !== null).map(k => `<i class="pip ${st[k] ? "on" : ""}"></i>`).join("") : "";
  const ex = examNames(ds);
  return `<button class="cell ${cls} ${ds === t ? "today" : ""} ${ex ? "exam" : ""}" data-act="openDay" data-date="${ds}" aria-label="${longDate(ds)}${ex ? ", exam: " + esc(ex) : ""}">
    <span class="dn">${inMonthDay}</span>${cls === "full" ? `<span class="ck">${CHECK}</span>` : ""}<span class="pips">${pips}</span></button>`;
}
const examNames = ds => S.settings.classes.filter(c => c.exam === ds).map(c => c.name).join(", ");
const examChip = ds => { const n = examNames(ds); return n ? `<span class="chip exam">Exam: ${esc(n)}</span>` : ""; };
function weekDates() { const c = S.cal.cursor, st = addDays(c, -parse(c).getDay()); return Array.from({ length: 7 }, (_, i) => addDays(st, i)); }
function weekSummary(dates) {
  const t = todayStr(), s0 = startDateStr(), days = dates.filter(d => d <= t && d >= s0);
  let full = 0, tracked = 0, wk = 0, wkDays = 0, cal = 0, calDays = 0, mins = 0, goal = 0; const per = {};
  for (const d of days) {
    const st = status(d), v = dayView(d);
    if (st.level !== "na") { tracked++; if (st.level === "full") full++; }
    if (st.workout !== null) { wkDays++; if (st.workout) wk++; }
    if (st.cal !== null) { calDays++; if (st.cal) cal++; }
    for (const x of v.sessions) { per[x.classId] = (per[x.classId] || 0) + x.sec / 60; mins += x.sec / 60; }
    for (const id in v.snap.plan) goal += v.snap.plan[id].goal;
  }
  const a = streak("all"), L = [`Tally: ${shortDate(dates[0])} – ${shortDate(dates[6])}`, ""];
  if (!days.length) return L.concat("Nothing tracked yet for this week.").join("\n");
  L.push(`Days with all goals met: ${full} of ${tracked}`);
  if (goal || mins) L.push(`Study: ${fmtMin(mins)} of ${fmtMin(goal)} planned`);
  for (const [id, m] of Object.entries(per).sort((x, y) => y[1] - x[1])) L.push(`  - ${classById(id)?.name || "Class"}: ${fmtMin(m)}`);
  if (wkDays) L.push(`Workouts: ${wk} of ${wkDays} planned days`);
  if (calDays) L.push(`Under calorie limit: ${cal} of ${calDays} days`);
  L.push(`Current streak: ${a.cur} days (best ${a.best})`);
  const soon = S.settings.classes.filter(c => c.exam && daysUntil(c.exam, t) >= 0 && daysUntil(c.exam, t) <= 14).sort((x, y) => x.exam < y.exam ? -1 : 1);
  if (soon.length) { L.push("", "Coming up:"); soon.forEach(c => L.push(`  - ${c.name} exam ${shortDate(c.exam)} (${daysUntil(c.exam, t) === 0 ? "today" : daysUntil(c.exam, t) === 1 ? "tomorrow" : daysUntil(c.exam, t) + " days"})`)); }
  return L.join("\n");
}
function weekPanel(dates) {
  return `<section class="panel"><div class="panel-head"><h2>Weekly summary</h2></div><pre class="sumtext">${esc(weekSummary(dates))}</pre>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-act="emailSummary">Email this to me</button><button class="btn alt sm" data-act="copySummary">Copy</button></div></section>`;
}
function monthDates(y, m) { const n = new Date(y, m + 1, 0).getDate(); return Array.from({ length: n }, (_, i) => dstr(new Date(y, m, i + 1))); }

function streakTiles() {
  const defs = [["all", "All goals"], ["study", "Study"], ["workout", "Workout"], ["cal", "Calories"]];
  return `<div class="tiles">${defs.map(([k, n]) => { const r = streak(k); return `<div class="tile ${r.cur >= 3 ? "hot" : ""}"><b>${r.cur}</b><span>${n} streak</span><i>best ${r.best}</i></div>`; }).join("")}</div>`;
}

function renderCalendar() {
  const c = S.cal, cur = parse(c.cursor), y = cur.getFullYear(), m = cur.getMonth();
  let title, dates, body = "";
  if (c.mode === "week") {
    const start = addDays(c.cursor, -cur.getDay()); dates = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    title = `${shortDate(dates[0])} – ${shortDate(dates[6])}`;
    const t = todayStr(), s0 = startDateStr();
    body = dates.map(ds => {
      const st = status(ds), v = dayView(ds), future = ds > t, ids = Object.keys(v.snap.plan);
      const chips = (future || ds < s0) ? `<span class="chip">${future ? "Upcoming" : "Before start"}</span>` : st.level === "na" ? `<span class="chip">No goals</span>` : [
        st.study !== null ? `<span class="chip ${st.study ? "ok" : ""}">Study ${ids.filter(i => v.done[i]).length}/${ids.length}</span>` : "",
        st.workout !== null ? `<span class="chip ${st.workout ? "ok" : ""}">Workout</span>` : "",
        st.cal !== null ? `<span class="chip ${st.cal ? "ok" : ""}">Calories</span>` : ""].join("");
      return `<button class="wrow ${!future && st.level === "full" ? "full" : ""}" data-act="openDay" data-date="${ds}">
        <div class="wd"><b>${DOW[parse(ds).getDay()]}</b><span>${shortDate(ds)}</span></div><div class="wchips">${chips}${examChip(ds)}</div>
        ${!future && st.level === "full" ? `<span class="wcheck">${CHECK}</span>` : ""}</button>`;
    }).join("") + weekPanel(dates);
  } else if (c.mode === "month") {
    title = `${MONTHS[m]} ${y}`; dates = monthDates(y, m);
    const lead = new Date(y, m, 1).getDay(), cells = [];
    for (let i = 0; i < lead; i++) cells.push(null);
    dates.forEach((ds, i) => cells.push({ ds, n: i + 1 }));
    while (cells.length % 7) cells.push(null);
    let g = `<div class="mgrid">${DOW.map(d => `<div class="dow">${d.slice(0, 2)}</div>`).join("")}<div class="dow">Wk</div>`;
    for (let r = 0; r < cells.length; r += 7) {
      const row = cells.slice(r, r + 7);
      g += row.map(x => x ? dayCell(x.ds, x.n) : `<div class="cell blank"></div>`).join("");
      const ps = periodStats(row.filter(Boolean).map(x => x.ds));
      g += `<div class="wk ${ps.tracked && ps.full === ps.tracked ? "full" : ""}">${ps.tracked ? `${ps.full}/${ps.tracked}` : ""}</div>`;
    }
    body = g + `</div><div class="legend"><span><i style="background:var(--green)"></i>All goals</span><span><i style="background:var(--amber-soft);border:1px solid #F1D9A8"></i>Some goals</span><span>Dots: study, workout, calories</span><span>◆ Exam</span></div>`;
  } else {
    title = String(y); dates = [];
    let g = `<div class="year">`;
    for (let mo = 0; mo < 12; mo++) {
      const md = monthDates(y, mo); dates.push(...md);
      const ps = periodStats(md), t = todayStr(), s0 = startDateStr(), lead = new Date(y, mo, 1).getDay();
      g += `<button class="ymonth" data-act="openMonth" data-date="${md[0]}"><div class="yh"><b>${MONTHS[mo].slice(0, 3)}</b><span>${ps.tracked ? `${ps.full}/${ps.tracked}` : ""}</span></div><div class="ygrid">`;
      g += Array.from({ length: lead }, () => `<i class="sq blank"></i>`).join("");
      g += md.map(ds => { const st = status(ds); const k = ds > t || ds < s0 ? "future" : st.level; return `<i class="sq ${k}"></i>`; }).join("");
      g += `</div></button>`;
    }
    body = g + `</div><div class="legend"><span><i style="background:var(--green)"></i>All goals</span><span><i style="background:var(--amber)"></i>Some goals</span><span><i style="background:#D9DFE4"></i>Missed</span></div>`;
  }
  const ps = periodStats(dates);
  return `<h1>Calendar</h1><p class="sub">Every green day means every goal was met.</p><div style="margin-top:14px">${streakTiles()}</div>
    <div class="calbar"><div class="seg" role="group" aria-label="Zoom">${["week", "month", "year"].map(k => `<button class="${c.mode === k ? "on" : ""}" data-act="calMode" data-mode="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("")}</div>
      <div class="calnav"><button class="icon" data-act="calPrev" aria-label="Previous">‹</button><div class="caltitle">${title}</div><button class="icon" data-act="calNext" aria-label="Next">›</button></div></div>
    <div class="calstat"><b>${ps.full}</b> of ${ps.tracked} tracked days with all goals met</div>${body}`;
}

      <div class="cls-grid"><label class="f">Minutes per study day<input class="in" type="number" min="0" step="5" value="${c.minutes}" data-chg="clsMin" data-id="${c.id}"></label>
        <label class="f">Priority<select class="in" data-chg="clsPri" data-id="${c.id}">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${n === c.priority ? "selected" : ""}>${n}${n === 1 ? " (low)" : n === 5 ? " (high)" : ""}</option>`).join("")}</select></label>
        <label class="f">Start time (optional)<input class="in" type="time" value="${esc(c.start || "")}" data-chg="clsStart" data-id="${c.id}"></label>
        <label class="f">Exam date (optional)<input class="in" type="date" value="${esc(c.exam || "")}" data-chg="clsExam" data-id="${c.id}"></label></div>
      <div class="chips">${dayChips(c.days, "toggleClsDay", `data-id="${c.id}"`)}</div></div>`).join("");
  h += s.classes.length ? `<div class="split"><label class="f">Daily study budget (minutes)<input class="in" id="budget" type="number" min="0" step="15" value="${s.dailyBudget}" data-chg="budget" data-keep></label>
      <button class="btn alt" data-act="autoSplit">Split by priority</button></div>
      <p class="muted" style="font-size:13px;margin:8px 0 0">Splits the budget across all classes by priority, in 5-minute steps. Fine-tune each class afterward.</p>` : "";
  h += `</section>
  <section class="panel"><div class="panel-head"><h2>Schedule</h2></div>
    <div class="cls-grid" style="margin-top:0"><label class="f">Study starts at<input class="in" type="time" value="${esc(s.studyStart || "")}" data-chg="studyStart"></label>
      <label class="f">Break between classes (min)<input class="in" type="number" min="0" step="5" value="${s.breakMin ?? 10}" data-chg="breakMin"></label></div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Classes without their own start time are stacked in priority order from this time. Classes with a start time stay where you put them. Clear the time to hide the schedule.</p>
    <div class="toggle" style="margin-top:8px"><span>Raise goals before exams</span><button class="cb ${s.examBoost !== false ? "on" : ""}" data-act="toggleExamBoost">${s.examBoost !== false ? "On" : "Off"}</button></div>
    <p class="muted" style="font-size:13px;margin:0">Daily minutes grow 1.5× within 14 days of an exam, 2× within 7 days and 2.5× within 3 days.</p></section>
  <section class="panel"><div class="panel-head"><h2>Goals</h2></div>
    <div class="toggle"><span>Study goals</span><button class="cb ${s.study.enabled ? "on" : ""}" data-act="toggleGoal" data-g="study">${s.study.enabled ? "On" : "Off"}</button></div>
    <div class="toggle"><span>Workouts</span><button class="cb ${s.workout.enabled ? "on" : ""}" data-act="toggleGoal" data-g="workout">${s.workout.enabled ? "On" : "Off"}</button></div>
    <div class="toggle"><span>Calorie limit</span><button class="cb ${s.calories.enabled ? "on" : ""}" data-act="toggleGoal" data-g="calories">${s.calories.enabled ? "On" : "Off"}</button></div>
  </section>
  ${s.workout.enabled ? workoutPanel() : ""}${s.calories.enabled ? caloriePanel() : ""}
  <section class="panel"><div class="panel-head"><h2>Account and data</h2></div>
    <p class="muted" style="margin:0 0 10px">${store.mode === "firebase" ? `Signed in as ${esc(store.email())}. Your data syncs across devices.` : "Local mode (${LOCAL_WHY}): data lives only in this browser. Fill in firebase-config.js to sync across devices."}</p>
    <label class="f" style="margin-bottom:10px">Send weekly summaries to<input class="in" type="email" value="${esc(s.summaryEmail || "")}" data-chg="summaryEmail" placeholder="you@example.com"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt sm" data-act="exportData">Export JSON</button>${store.mode === "firebase" ? `<button class="btn alt sm" data-act="signOut">Sign out</button>` : ""}</div></section>`;
  return h;
}

/* ============================================================
   8. Actions
   ============================================================ */
const ACT = {
  signIn: () => store.signIn(),
  signOut: () => { stopSub(); store.signOut(); },
  tab: el => { S.tab = el.dataset.tab; render(); scrollTo(0, 0); },
  prevDay: () => { S.selDate = addDays(S.selDate, -1); render(); },
  nextDay: () => { if (S.selDate < todayStr()) { S.selDate = addDays(S.selDate, 1); render(); } },
  goToday: () => { S.selDate = todayStr(); render(); },
  openDay: el => { S.selDate = el.dataset.date; S.tab = "today"; render(); scrollTo(0, 0); },
  openMonth: el => { S.cal = { mode: "month", cursor: el.dataset.date }; render(); },
  calMode: el => { S.cal.mode = el.dataset.mode; render(); },
  calPrev: () => calStep(-1), calNext: () => calStep(1),

  toggleClass: el => updateDay(S.selDate, d => { d.done[el.dataset.id] = !d.done[el.dataset.id]; }),
  playClass: el => startTimer(el.dataset.id),
  startTimerSel: () => { const sel = $("#timerClass"); if (sel?.value) startTimer(sel.value); },
  stopTimer: () => stopTimer(),
  addMin: el => {
    const m = parseFloat(prompt("Minutes to add?", "30"));
    if (!(m > 0)) return;
    const ds = S.selDate, start = ds === todayStr() ? Date.now() : parse(ds).getTime() + 12 * 3600e3;
    updateDay(ds, d => addSession(d, { classId: el.dataset.id, start, sec: Math.round(m * 60), manual: true }));
  },
  delSession: el => updateDay(S.selDate, d => { d.sessions = d.sessions.filter(x => x.id !== el.dataset.id); }),

  toggleWorkout: () => updateDay(S.selDate, d => { d.workout.done = !d.workout.done; }),
  addCal: () => {
    const kcal = Math.round(parseFloat($("#calKcal").value)); const label = $("#calLabel").value.trim();
    if (!(kcal > 0)) { toast("Enter calories as a number"); return; }
    $("#calKcal").value = ""; $("#calLabel").value = "";
    updateDay(S.selDate, d => {
      d.cal.entries.push({ id: uid(), label, kcal });
      if (d.cal.entries.reduce((a, e) => a + e.kcal, 0) > d.snap.limit) d.cal.ok = false;
    });
  },
  delCal: el => updateDay(S.selDate, d => { d.cal.entries = d.cal.entries.filter(x => x.id !== el.dataset.id); }),
  toggleCalOk: () => updateDay(S.selDate, d => { d.cal.ok = !d.cal.ok; }),

  addClass: () => {
    const name = $("#newClass").value.trim(); if (!name) { toast("Type a class name first"); return; }
    $("#newClass").value = "";
    const used = S.settings.classes.map(c => c.color), color = COLORS.find(c => !used.includes(c)) || COLORS[S.settings.classes.length % COLORS.length];
    commitSettings({ classes: [...S.settings.classes, { id: uid(), name, color, minutes: 45, priority: 3, days: [1, 2, 3, 4, 5], start: "", exam: "" }] });
  },
  delClass: el => {
    const c = classById(el.dataset.id); if (!c || !confirm(`Delete ${c.name}? Past study logs stay in your history.`)) return;
    commitSettings({ classes: S.settings.classes.filter(x => x.id !== c.id) });
  },
  toggleClsDay: el => editClass(el.dataset.id, c => { const d = +el.dataset.d; c.days = c.days.includes(d) ? c.days.filter(x => x !== d) : [...c.days, d].sort(); }),
  autoSplit: () => {
    const budget = parseFloat($("#budget").value); if (!(budget > 0)) { toast("Enter a daily budget in minutes"); return; }
    const cl = structuredClone(S.settings.classes), sum = cl.reduce((a, c) => a + c.priority, 0) || 1;
    cl.forEach(c => { c.minutes = Math.max(5, Math.round(budget * c.priority / sum / 5) * 5); });
    commitSettings({ classes: cl, dailyBudget: budget }); toast("Study plan updated");
  },
  toggleGoal: el => { const g = el.dataset.g; commitSettings({ [g]: { ...S.settings[g], enabled: !S.settings[g].enabled } }); },
  bulkDay: el => { const k = el.dataset.kind, d = +el.dataset.d, a = S.bulk[k]; S.bulk[k] = a.includes(d) ? a.filter(x => x !== d) : [...a, d].sort(); render(); },
  bulkPreset: el => { S.bulk[el.dataset.kind] = { weekdays: [1, 2, 3, 4, 5], weekend: [0, 6], all: [0, 1, 2, 3, 4, 5, 6], none: [] }[el.dataset.p]; render(); },
  bulkWkApply: () => {
    const days = S.bulk.wk; if (!days.length) { toast("Pick at least one day first"); return; }
    const label = $("#bulkWkLabel").value.trim() || "Workout", minutes = Math.max(0, Math.round(+$("#bulkWkMin").value || 0));
    editWorkout(w => days.forEach(d => { w.plan[d] = { label, minutes }; })); toast(`Workout set for ${days.length} day${days.length === 1 ? "" : "s"}`);
  },
  bulkWkRest: () => { const days = S.bulk.wk; if (!days.length) { toast("Pick at least one day first"); return; } editWorkout(w => days.forEach(d => { delete w.plan[d]; })); },
  wkAdd: el => editWorkout(w => { w.plan[el.dataset.d] = { label: "Workout", minutes: 0 }; }),
  wkRest: el => editWorkout(w => { delete w.plan[el.dataset.d]; }),
  bulkCalApply: () => {
    const days = S.bulk.cal, k = Math.round(+$("#bulkCal").value);
    if (!days.length) { toast("Pick at least one day first"); return; }
    if (!(k >= 0) || !$("#bulkCal").value) { toast("Enter a calorie limit"); return; }
    editCal(c => days.forEach(d => { c.limits[d] = k; })); toast(`Limit set for ${days.length} day${days.length === 1 ? "" : "s"}`);
  },
  bulkCalClear: () => { const days = S.bulk.cal; if (!days.length) { toast("Pick at least one day first"); return; } editCal(c => days.forEach(d => { delete c.limits[d]; })); },
  calReset: el => editCal(c => { delete c.limits[el.dataset.d]; }),
  toggleExamBoost: () => commitSettings({ examBoost: S.settings.examBoost === false }),
  copySummary: async () => { try { await navigator.clipboard.writeText(weekSummary(weekDates())); toast("Summary copied"); } catch { toast("Couldn't copy. Select the text instead."); } },
  emailSummary: () => {
    const d = weekDates(), to = encodeURIComponent(S.settings.summaryEmail || "");
    location.href = `mailto:${to}?subject=${encodeURIComponent(`Tally weekly summary, ${shortDate(d[0])} – ${shortDate(d[6])}`)}&body=${encodeURIComponent(weekSummary(d))}`;
  },
  exportData: () => {
    const blob = new Blob([JSON.stringify({ settings: S.settings, days: S.days }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `tally-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
};
function editWorkout(fn) { const w = structuredClone(S.settings.workout); w.plan = w.plan || {}; fn(w); commitSettings({ workout: w }); }
function editCal(fn) { const c = structuredClone(S.settings.calories); c.limits = c.limits || {}; fn(c); commitSettings({ calories: c }); }
function editClass(id, fn) { const cl = structuredClone(S.settings.classes), c = cl.find(x => x.id === id); if (!c) return; fn(c); commitSettings({ classes: cl }); }
function calStep(n) {
  const c = S.cal, d = parse(c.cursor);
  if (c.mode === "week") c.cursor = addDays(c.cursor, 7 * n);
  else if (c.mode === "month") c.cursor = dstr(new Date(d.getFullYear(), d.getMonth() + n, 1));
  else c.cursor = dstr(new Date(d.getFullYear() + n, 0, 1));
  render();
}
const CHG = {
  workoutNote: el => updateDay(S.selDate, d => { d.workout.note = el.value.trim(); }),
  clsName: el => editClass(el.dataset.id, c => { c.name = el.value.trim() || c.name; }),
  clsColor: el => editClass(el.dataset.id, c => { c.color = el.value; }),
  clsMin: el => editClass(el.dataset.id, c => { c.minutes = Math.max(0, Math.round(+el.value || 0)); }),
  clsStart: el => editClass(el.dataset.id, c => { c.start = el.value; }),
  clsExam: el => editClass(el.dataset.id, c => { c.exam = el.value; }),
  studyStart: el => commitSettings({ studyStart: el.value }),
  breakMin: el => commitSettings({ breakMin: Math.max(0, Math.round(+el.value || 0)) }),
  summaryEmail: el => { S.settings.summaryEmail = el.value.trim(); store.saveSettings({ summaryEmail: S.settings.summaryEmail }); },
  clsPri: el => editClass(el.dataset.id, c => { c.priority = +el.value; }),
  budget: el => { S.settings.dailyBudget = +el.value || 0; store.saveSettings({ dailyBudget: S.settings.dailyBudget }); },
  wkLabel: el => editWorkout(w => { if (w.plan[el.dataset.d]) w.plan[el.dataset.d].label = el.value.trim() || "Workout"; }),
  wkMin: el => editWorkout(w => { if (w.plan[el.dataset.d]) w.plan[el.dataset.d].minutes = Math.max(0, Math.round(+el.value || 0)); }),
  calDay: el => editCal(c => { if (el.value === "") delete c.limits[el.dataset.d]; else c.limits[el.dataset.d] = Math.max(0, Math.round(+el.value || 0)); }),
  calLimit: el => commitSettings({ calories: { ...S.settings.calories, limit: Math.max(0, Math.round(+el.value || 0)) } })
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) ACT[el.dataset.act]?.(el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-chg]"); if (el) CHG[el.dataset.chg]?.(el); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "calKcal" || e.target.id === "calLabel")) ACT.addCal(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.lastToday !== todayStr()) { S.lastToday = todayStr(); S.selDate = todayStr(); render(); }
});
S.lastToday = todayStr();

/* ============================================================
   9. Boot
   ============================================================ */
function stopSub() { S.unsub?.(); S.unsub = null; S.loaded = { s: false, d: false }; S.seeded = false; S.days = {}; }
function startData() {
  stopSub();
  S.unsub = store.start(
    r => {
      if (r === null && !S.seeded) { S.seeded = true; const d = defaultSettings(); store.saveSettings(d); S.settings = d; }
      else S.settings = mergeSettings(r);
      S.loaded.s = true; render();
    },
    d => { S.days = d; S.loaded.d = true; render(); }
  );
}
if (store.mode === "local") startData();
else store.onAuth(u => {
  $("#auth").classList.toggle("hidden", !!u);
  if (u) startData(); else stopSub();
});
</script>
</body>
</html>
