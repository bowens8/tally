<title>Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEEF1; --surface:#fff; --ink:#16202A; --muted:#64717E; --line:#D8DEE4;
  --green:#17A058; --green-soft:#D6F0E1; --amber:#E7A53A; --amber-soft:#FBEBCF;
  --red:#CF4B45; --red-soft:#F7DDDB;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:18px;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
.muted{color:var(--muted)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand b{font:800 20px var(--display);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:220px;border:0;background:none;border-radius:12px;padding:10px 6px;font:700 14px var(--display);color:var(--muted)}
nav.tabs button.on{background:var(--ink);color:#fff}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.panel-head .tot{font:600 13px var(--display);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:700 14px var(--display);background:var(--ink);color:#fff}
.btn.alt{background:#E6EAEE;color:var(--ink)}
.btn.go{background:var(--green)}
.btn.stop{background:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;line-height:1}
.icon.sm{width:32px;height:32px;font-size:13px}
.icon.danger{color:var(--red)}
.in,select.in{border:1px solid var(--line);background:#F7F9FA;border-radius:10px;padding:9px 11px;min-width:0;width:100%}

/* day header */
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayhead .mid{flex:1;min-width:0}
.banner{margin-top:12px;border-radius:14px;padding:12px 14px;font:700 15px var(--display);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.banner small{font:500 13px var(--body);opacity:.85}
.banner.full{background:var(--green);color:#fff}
.banner.part{background:var(--amber-soft)}
.banner.none,.banner.na{background:#E1E6EA}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#F2F5F7;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.timer .clock{font:800 40px var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:1;min-width:120px}
.timer .clock.idle{color:#B3BCC5}
.timer .tlabel{width:100%;font:600 13px var(--display);color:var(--muted)}
.timer.running{background:var(--ink);color:#fff}
.timer.running .tlabel{color:#AEB9C4}
.timer select{max-width:170px}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rowmain{flex:1;min-width:0}
.rname{font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .rname{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:6px;background:#E6EAEE;border-radius:9px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:9px}
.rmeta{font:600 12px var(--display);color:var(--muted);white-space:nowrap}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #B9C3CC;background:#fff;display:grid;place-items:center;color:transparent;padding:0}
.check svg{width:18px;height:18px}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check.big{width:36px;height:36px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.sess{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.sess span:first-child{color:var(--muted);width:64px}
.sess .grow{flex:1}

/* calories */
.calnum{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.calnum small{font:500 14px var(--body);color:var(--muted)}
.calnum.over{color:var(--red)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .in:first-child{flex:2}
.addrow .in:nth-child(2){flex:1}

/* streak tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px}
.tile b{display:block;font:800 26px var(--display);line-height:1}
.tile span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.tile i{font-style:normal;font-size:11px;color:var(--muted)}
.tile.hot{background:var(--green-soft);border-color:#B5E2C8}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* calendar */
.seg{display:inline-flex;background:#DDE3E8;border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font:700 13px var(--display);color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;gap:8px}
.caltitle{font:800 20px var(--display);min-width:150px;text-align:center}
.calstat{margin-top:10px;color:var(--muted);font-size:14px}
.calstat b{color:var(--ink);font:800 16px var(--display)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr) 38px;gap:5px;margin-top:10px}
.dow{font:600 11px var(--display);color:var(--muted);text-align:center}
.cell{position:relative;aspect-ratio:1/1.08;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.cell .dn{font:600 11px var(--display);color:var(--muted)}
.cell .pips{display:flex;gap:3px;justify-content:center;min-height:6px}
.pip{width:6px;height:6px;border-radius:50%;background:#D5DCE2}
.pip.on{background:var(--green)}
.cell .ck{position:absolute;inset:0;display:grid;place-items:center;padding-top:6px}
.cell .ck svg{width:55%;max-width:26px}
.cell.full{background:var(--green);border-color:var(--green);color:#fff}
.cell.full .dn{color:#D5F2E2;position:relative;z-index:1}
.cell.part{background:var(--amber-soft);border-color:#F1D9A8}
.cell.future,.cell.before{background:transparent;border-style:dashed;opacity:.55}
.cell.blank{visibility:hidden}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.wk{align-self:center;text-align:center;font:700 11px var(--display);color:var(--muted)}
.wk.full{color:var(--green)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;margin-top:8px}
.wrow .wd{width:62px}
.wrow .wd b{display:block;font:800 16px var(--display)}
.wrow .wd span{font-size:12px;color:var(--muted)}
.wrow .wchips{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.wrow.full{background:var(--green-soft);border-color:#B5E2C8}
.chip{border-radius:999px;padding:4px 10px;font:600 12px var(--display);background:#E6EAEE;color:var(--muted)}
.chip.ok{background:var(--green);color:#fff}
.wrow .wcheck{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.wrow .wcheck svg{width:16px}
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media(max-width:560px){.year{grid-template-columns:repeat(2,1fr)}}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.ymonth .yh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ymonth .yh b{font:800 14px var(--display)}
.ymonth .yh span{font:600 12px var(--display);color:var(--muted)}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.sq{aspect-ratio:1;border-radius:3px;background:#EEF1F3}
.sq.full{background:var(--green)}
.sq.part{background:var(--amber)}
.sq.none{background:#D9DFE4}
.sq.future,.sq.na,.sq.blank{background:transparent;border:1px dashed #D5DCE2}
.sq.blank{border:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* setup */
.cls{border-top:1px solid var(--line);padding:14px 0}
.cls:first-of-type{border-top:0}
.cls-top{display:flex;gap:8px;align-items:center}

.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f .in{margin-top:4px;color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:700 12px var(--display);color:var(--muted)}
.cb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.split{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.split label{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.empty{color:var(--muted);padding:6px 0 2px}

.blk{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font:700 11px var(--display);background:var(--ink);color:#fff;margin-left:6px}
.cell.exam::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--ink);transform:rotate(45deg)}
.cell.full.exam::after{background:#fff}
.sumtext{white-space:pre-wrap;font:13px/1.55 var(--body);background:#F2F5F7;border-radius:12px;padding:12px;margin:10px 0 0}
.chip.exam{background:var(--ink);color:#fff}
.calstatus{margin:10px 0 0;border-radius:10px;padding:9px 12px;font:600 13px var(--display)}
.calstatus.ok{background:var(--green-soft);color:#0F6B3A}
.calstatus.over{background:var(--red-soft);color:#9B2C27}
.dayrow{display:grid;grid-template-columns:40px 1fr 78px 32px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dayrow:first-of-type{border-top:0}
.dayrow .dn2{font:700 13px var(--display)}
.dayrow .rest{grid-column:2 / 4;color:var(--muted)}
.dayrow.cal{grid-template-columns:40px 1fr 32px}
.bulk{background:#F2F5F7;border-radius:14px;padding:12px;margin-bottom:12px}
.bulk .addrow{margin-top:8px}
.presets{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.presets .cb{font-weight:600;padding:4px 9px}
/* misc */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:20}
.auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:30;text-align:center}
.auth div{max-width:340px}
.auth h1{font-size:44px;margin-bottom:8px}
.auth p{color:var(--muted);margin:0 0 22px}
.hidden{display:none!important}
@media(prefers-reduced-motion:no-preference){.check,.bar span{transition:background .15s,width .25s}}

/* ---- v4 additions ---- */
nav.tabs button{padding:10px 4px;font-size:13px}
.center{text-align:center;margin:10px 0 0}
.hbtns{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font:700 12px var(--display);color:var(--muted)}
.mini:hover{color:var(--ink)}
.banner.na{background:#D3DAE0}

/* calendar cells: one colored band per goal */
.cell{overflow:hidden;padding:0;display:block}
.cell .dn{position:absolute;top:3px;left:3px;z-index:2;background:rgba(255,255,255,.9);color:var(--ink);border-radius:6px;padding:0 5px;font:700 11px var(--display);line-height:16px}
.segs{position:absolute;inset:0;display:flex}
.segs i{flex:1}
.segs i+i{border-left:2px solid var(--bg)}
.segs .ok{background:var(--green)}
.segs .fail{background:#E0605A}
.segs .open{background:#fff}
.cell.na{background:#D3DAE0;border-color:#D3DAE0}
.cell.na .dn{background:transparent;color:#6F7C88}
.cell.future .dn,.cell.before .dn{background:transparent}
.cell .ck{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:#fff;padding-top:10px}
.cell .ck svg{width:46%;max-width:24px}
.cell.exam::after{z-index:3}
.sq{background-color:#fff;border:1px solid var(--line)}
.sq.na{background:#D3DAE0;border-color:#D3DAE0}
.sq.future,.sq.before{background:transparent;border:1px dashed #D5DCE2}
.sq.blank{border:0;background:transparent}
.chip.ok{background:var(--green);color:#fff}
.chip.fail{background:#E0605A;color:#fff}
.chip.open{background:#fff;border:1px solid var(--line);color:var(--muted)}
.chip.rest{background:#D3DAE0;color:#5E6B77}
.legend .lg{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* day timeline */
.tl{position:relative;margin:6px 0 4px}
.tl-h{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-h span{position:absolute;top:-8px;left:0;font:600 11px var(--display);color:var(--muted);background:var(--surface);padding-right:5px}
.tl-b{position:absolute;left:62px;right:34%;border:0;border-left:4px solid;border-radius:8px;text-align:left;padding:3px 8px;overflow:hidden;color:var(--ink);display:block}
.tl-b b{display:block;font:700 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.tl-b.done{opacity:.55}
.tl-b .tl-ck{position:absolute;right:6px;top:4px;color:var(--green);display:block}
.tl-b .tl-ck svg{width:16px}
.tl-s{position:absolute;right:6px;width:26%;border-radius:5px;min-height:4px}

/* running timer bar */
.mtbar{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:692px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;z-index:6}
.mtbar .live{width:9px;height:9px;border-radius:50%;background:#FF6B64;flex:none}
.mtbar b{font:800 18px var(--display);font-variant-numeric:tabular-nums}
.mtbar .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#C9D2DA}

/* editors and progress */
.editbox{background:#F2F5F7;border-radius:14px;padding:12px;margin-top:10px}
.erow{display:grid;grid-template-columns:1fr 70px 96px 32px;gap:8px;align-items:center;padding:6px 0}
.erow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam{border-top:1px solid var(--line);padding:14px 0}
.exam:first-of-type{border-top:0}
.exam h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exam .when{font:600 12px var(--display);color:var(--muted)}
.exstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat{background:#F2F5F7;border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font:800 15px var(--display);color:var(--ink)}
.scorerow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.scorerow .in{width:84px}
.pct{font:800 20px var(--display)}
.steprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0;font-size:13px}
.steprow .in{width:72px;padding:6px 8px}
.steprow select.in{width:auto}
.chart{width:100%;height:auto;margin-top:10px;display:block}
.chart path.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--ink)}
.chart text{font:600 10px var(--display);fill:var(--muted)}
.chart line{stroke:var(--line)}
.hbar{height:8px;border-radius:5px;background:#E6EAEE;margin-top:4px;overflow:hidden}
.hbar span{display:block;height:100%}
.crow{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.crow:first-of-type{border-top:0}
.crow .top{display:flex;justify-content:space-between;gap:10px}
.crow .top span:last-child{color:var(--muted);font:600 12px var(--display)}
/* ---- v5 mobile layout ---- */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-left:10px;padding-right:10px}
nav.tabs button{max-width:none;padding:11px 2px;font-size:13px}
.timer{display:grid;gap:10px;align-items:stretch}
.timer select.in{max-width:none;width:100%}
.timer .trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .clock{flex:none;min-width:0;font-size:44px}
.timer.running .tlabel{width:auto;font-size:14px}
.row.study{align-items:flex-start}
.row.study .check{margin-top:1px}
.row.study .rname{white-space:normal;overflow:visible;text-overflow:clip;align-items:flex-start;line-height:1.25}
.row.study .rname .dot{margin-top:5px}
.row.study .rmeta{margin-top:6px;font-size:12px}
.row.study .icon.sm{width:34px;height:34px}
h1{overflow-wrap:anywhere}
/* ---- v6: workouts on the schedule, vacations ---- */
.tl-b.wk b::before{content:"";}
.vacnote{margin:10px 0 0;text-align:center;font-size:13px;color:#5E6B77;background:#D3DAE0;border-radius:10px;padding:7px 10px}
.cell.vac::before{content:"✈";position:absolute;right:3px;bottom:1px;font-size:10px;line-height:1;z-index:3;color:#33414E}
.cell.full.vac::before{color:#fff}
.wkrow{display:grid;grid-template-columns:40px 1fr 32px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wkrow:first-of-type{border-top:0}
.wkrow.restrow{grid-template-columns:40px 1fr auto}
.wkrow2{grid-column:2 / 4;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wkrow .dn2{font:700 13px var(--display)}
.row.study .rname{flex-wrap:wrap;gap:3px 8px}
.row.study .rname .badge{margin-left:0;flex:none}
</style>

<body>
<div class="auth hidden" id="auth">
  <div>
    <h1>📖 Tally</h1>
    <p>Set daily goals for your classes, workouts and calories. Check them off and watch the green days stack up.</p>
    <button class="btn go" data-act="signIn">Sign in with Google</button>
  </div>
</div>

<div class="wrap">
  <div class="brand"><b>📖 Tally</b><span id="modeNote"></span></div>
  <div id="view"><p class="muted">Loading…</p></div>
</div>

<div id="mtbar" class="mtbar hidden"><span class="live"></span><span class="lab" id="mtlab"></span><b id="mtclock"></b><button class="btn stop sm" data-act="stopTimer">Stop</button></div>

<nav class="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today">Today</button>
  <button data-act="tab" data-tab="calendar">Calendar</button>
  <button data-act="tab" data-tab="progress">Progress</button>
  <button data-act="tab" data-tab="setup">Setup</button>
</nav>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
/* ============================================================
   1. FIREBASE CONFIG lives in firebase-config.js (same folder as this file).
   Keeping it separate means updating index.html never overwrites your keys.
   ============================================================ */
let FIREBASE_CONFIG = { apiKey: "YOUR_API_KEY" }, CONFIG_STATUS = "missing";
try { ({ FIREBASE_CONFIG } = await import("./firebase-config.js")); CONFIG_STATUS = "loaded"; }
catch (e) { console.warn("Could not load firebase-config.js, running in local mode.", e); }
const IS_FB = !!FIREBASE_CONFIG?.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");
const LOCAL_WHY = CONFIG_STATUS === "missing" ? "firebase-config.js not found" : "apiKey not set in firebase-config.js";

/* ============================================================
   2. Helpers
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");

const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return dstr(d); };
const todayStr = () => dstr(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = o => JSON.parse(JSON.stringify(o));
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const COLORS = ["#3B6FD8", "#7A5AF0", "#12A3A3", "#C23B8A", "#C79A12", "#5B6B7B", "#2D4A9E", "#6FA21B"];

const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };

/* ============================================================

const STD_STEPS = [{ within: 14, mode: "x", value: 1.5 }, { within: 7, mode: "x", value: 2 }, { within: 3, mode: "x", value: 2.5 }];
const PLUS_STEPS = [{ within: 14, mode: "+", value: 15 }, { within: 7, mode: "+", value: 30 }, { within: 3, mode: "+", value: 60 }];
const defaultSettings = () => ({
  classes: [], exams: [], weights: [], vacations: [], weightUnit: "lb", startDate: todayStr(),
  studyStart: "16:00", breakMin: 10, examBoost: true, summaryEmail: "",
  study: { enabled: true },
  workout: { enabled: true, plan: {} },

  timer: null
});
function mergeSettings(r) {

  if (!r.workout?.plan) { wk.plan = {}; (r.workout?.days || []).forEach(i => { wk.plan[i] = { label: "Workout", minutes: 30 }; }); }
  for (const k of Object.keys(wk.plan)) if (!(wk.plan[k]?.minutes > 0)) delete wk.plan[k];      // 0 minutes = no goal
  const cal = { ...d.calories, ...r.calories }; cal.limits = cal.limits || {};
  const classes = (r.classes || []).map(c => ({ start: "", ...c }));
  const exams = r.exams || classes.filter(c => c.exam).map(c => ({ id: uid(), classId: c.id, name: `${c.name} exam`, date: c.exam, steps: structuredClone(STD_STEPS), score: null, max: 100 }));
  return { ...d, ...r, classes, exams, weights: r.weights || [], vacations: r.vacations || [], study: { ...d.study, ...r.study }, workout: wk, calories: cal };
}
const S = {
  tab: "today", selDate: todayStr(), cal: { mode: "month", cursor: todayStr() }, editPlan: false,
  settings: defaultSettings(), bulk: { wk: [], cal: [] }, vacNew: { study: true, workout: true, cal: true }, days: {}, loaded: { s: false, d: false }, seeded: false, unsub: null
};
const classById = id => S.settings.classes.find(c => c.id === id);
const className = id => classById(id)?.name || (id === "_other" ? "General study" : "Class");

/* ============================================================
   5. Plan, day model, status
   ============================================================ */
function nearestExam(classId, ds) {
  return S.settings.exams.filter(e => e.classId === classId && daysUntil(e.date, ds) >= 0).sort((a, b) => a.date < b.date ? -1 : 1)[0];
}
function applyRamp(base, ex, ds) {
  const n = daysUntil(ex.date, ds);
  const step = (ex.steps || []).filter(s => n <= s.within).sort((a, b) => a.within - b.within)[0];
  if (!step) return base;
  const g = step.mode === "+" ? base + (+step.value || 0) : base * (+step.value || 1);
  return round5(g);
}
/* Stack classes without a fixed start in list order, flowing around fixed ones. */
const fixedBlocks = (...ws) => ws.filter(w => w && w.start != null).map(w => ({ start: w.start, goal: w.minutes }));
function layoutPlan(plan, fixed = []) {
  const st = S.settings, br = st.breakMin ?? 10;
  const order = [...new Set([...st.classes.map(c => c.id), ...Object.keys(plan)])].filter(id => plan[id]);
  const pinned = [...order.map(id => plan[id]).filter(p => p.pin && p.start != null), ...fixed];
  let cur = hm(st.studyStart);
  for (const id of order) {
    const p = plan[id]; if (p.pin && p.start != null) continue;
    if (cur == null) { p.start = null; continue; }
    for (let moved = true; moved;) {
      moved = false;
      for (const q of pinned) if (cur < q.start + q.goal + br && cur + p.goal + br > q.start) { cur = q.start + q.goal + br; moved = true; }
    }
    p.start = cur; cur += p.goal + br;
  }
}
const sortedIds = plan => Object.keys(plan).sort((a, b) => (plan[a].start ?? 1e9) - (plan[b].start ?? 1e9));
function makeSnap(ds) {
  const dow = parse(ds).getDay(), st = S.settings, plan = {};
  if (st.study.enabled) for (const c of st.classes) if (c.days.includes(dow) && c.minutes > 0) {
    const ex = nearestExam(c.id, ds); let goal = c.minutes;
    if (ex && st.examBoost !== false) goal = applyRamp(c.minutes, ex, ds);
    const pin = hm(c.start) != null;
    plan[c.id] = { name: c.name, color: c.color, goal, start: pin ? hm(c.start) : null, pin, exam: ex ? { name: ex.name, date: ex.date } : null, adjusted: goal !== c.minutes };
  }
  const wp = st.workout.plan?.[dow], lim = st.calories.limits?.[dow] ?? st.calories.limit;
  const workout = st.workout.enabled && wp && wp.minutes > 0 ? { label: wp.label, minutes: wp.minutes, start: hm(wp.start) } : false;
  layoutPlan(plan, fixedBlocks(workout));
  return { plan, workout, cal: st.calories.enabled && lim > 0, limit: lim };
}
const newDay = ds => ({ date: ds, snap: makeSnap(ds), custom: false, done: {}, sessions: [], workout: { done: false, note: "" }, cal: { entries: [], ok: false } });
function vacationFor(ds) {
  const hit = S.settings.vacations.filter(v => v.start <= ds && ds <= v.end);
  if (!hit.length) return null;
  const absent = { study: false, workout: false, cal: false };
  hit.forEach(v => { for (const k in absent) if (v.absent?.[k]) absent[k] = true; });
  return { names: hit.map(v => v.name || "Away"), absent };
}
function dayView(ds) {
  const d = S.days[ds], vac = vacationFor(ds);
  let snap = d?.snap || makeSnap(ds);
  if (d?.snap && ds >= todayStr()) { snap = { ...snap, plan: structuredClone(snap.plan) }; layoutPlan(snap.plan, fixedBlocks(snap.workout, d.extra)); }
  if (vac) snap = { ...snap, plan: vac.absent.study ? {} : snap.plan, workout: vac.absent.workout ? false : snap.workout, cal: vac.absent.cal ? false : snap.cal };
  return {
    snap, vac, moved: d?.moved || null, extra: d?.extra || null, done: d?.done || {}, sessions: d?.sessions || [],
    workout: d?.workout || { done: false, note: "" }, cal: d?.cal || { entries: [], ok: false }, custom: !!(d?.custom || d?.customWk)
  };
}
/* One rest day per week (Sun-Sat): the workout moves to a later day that week. */
const weekBounds = ds => { const a = addDays(ds, -parse(ds).getDay()); return [a, addDays(a, 6)]; };
const wkdayName = ds => parse(ds).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
function moveUsedInWeek(ds) { const [a, b] = weekBounds(ds); return Object.keys(S.days).find(k => k >= a && k <= b && S.days[k].moved) || null; }
function workoutItems(v) {
  const items = [];
  if (v.snap.workout && !v.moved) items.push({ key: "main", label: v.snap.workout.label, minutes: v.snap.workout.minutes, start: v.snap.workout.start ?? null, done: !!v.workout.done });
  if (v.extra && S.settings.workout.enabled) items.push({ key: "extra", label: v.extra.label, minutes: v.extra.minutes, start: v.extra.start ?? null, done: !!v.extra.done, from: v.extra.from });
  return items;
}
const calTotal = v => v.cal.entries.reduce((a, e) => a + e.kcal, 0);
const loggedMin = (v, id) => v.sessions.filter(s => s.classId === id).reduce((a, s) => a + s.sec, 0) / 60;
function status(ds) {
  const v = dayView(ds), ids = Object.keys(v.snap.plan), wi = workoutItems(v);
  const study = !ids.length ? null : ids.every(id => v.done[id]);
  const workout = wi.length ? wi.every(i => i.done) : null;
  const cal = !v.snap.cal ? null : (v.cal.entries.length ? calTotal(v) <= v.snap.limit : !!v.cal.ok);
  const arr = [study, workout, cal].filter(x => x !== null);
  const level = !arr.length ? "na" : arr.every(Boolean) ? "full" : arr.some(Boolean) ? "part" : "none";
  return { study, workout, cal, level, done: arr.filter(Boolean).length, total: arr.length };
}
/* one band per goal: ok (green), fail (red), open (white) */
function segs(ds) {

    if (st[k] === null) continue;
    const overNow = k === "cal" && v.cal.entries.length && calTotal(v) > v.snap.limit;
    out.push({ k, state: st[k] ? "ok" : ds < t ? "fail" : ds === t && overNow ? "fail" : "open" });

}
function startDateStr() {
  let s = S.settings.startDate || todayStr();
  for (const k of Object.keys(S.days)) if (k < s) s = k;
  return s;
}
function streak(key) {
  const t = todayStr(); let d = startDateStr(), run = 0, best = 0;
  while (d <= t) {
    const st = status(d);
    const val = key === "all" ? (st.level === "na" ? null : st.level === "full") : st[key];
    if (val !== null) { if (val) { run++; if (run > best) best = run; } else if (d !== t) run = 0; }

async function updateDay(ds, fn) {
  const cur = S.days[ds] ? structuredClone(S.days[ds]) : newDay(ds);
  fn(cur);
  S.days[ds] = cur; render();

}
function addSession(d, s) {
  d.sessions.push({ id: uid(), ...s });
  const goal = d.snap.plan[s.classId]?.goal;
  const sec = d.sessions.filter(x => x.classId === s.classId).reduce((a, x) => a + x.sec, 0);
  if (goal && sec / 60 >= goal) d.done[s.classId] = true;
}

}

/* ---------- stats ---------- */
function examStats(ex) {
  if (!ex.classId) return null;
  const prev = S.settings.exams.filter(e => e.classId === ex.classId && e.date < ex.date).map(e => e.date).sort().pop();
  const from = prev ? addDays(prev, 1) : "0000-00-00";
  let sec = 0, sessions = 0; const days = new Set();
  for (const [ds, d] of Object.entries(S.days)) {
    if (ds < from || ds > ex.date) continue;
    for (const x of d.sessions || []) if (x.classId === ex.classId) { sec += x.sec; sessions++; days.add(ds); }
  }
  return { min: sec / 60, sessions, days: days.size, prev };
}
function classTotals() {
  const from30 = addDays(todayStr(), -29), all = {}, last = {};
  for (const [ds, d] of Object.entries(S.days)) for (const x of d.sessions || []) {
    all[x.classId] = (all[x.classId] || 0) + x.sec / 60;
    if (ds >= from30) last[x.classId] = (last[x.classId] || 0) + x.sec / 60;
  }
  return { all, last };
}

function render() {

  const keep = {}; document.querySelectorAll("[data-keep]").forEach(el => { if (el.id) keep[el.id] = el.value; });
  const ae = document.activeElement;
  const aid = ae && ae.id && ae.hasAttribute("data-keep") ? ae.id : null;
  const sel = aid && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;

  $("#view").innerHTML = ({ today: renderToday, calendar: renderCalendar, progress: renderProgress, setup: renderSetup }[S.tab])();

  for (const [id, val] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = val; }
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(...sel); } catch { } } }
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  $("#modeNote").textContent = store.mode === "local" ? `Local mode (${LOCAL_WHY}): saved in this browser only` : "";

const WK_COLOR = "#E07B2A";
function timeline(v) {
  const plan = v.snap.plan, ids = sortedIds(plan).filter(id => plan[id].start != null);
  const act = v.sessions.filter(x => !x.manual && x.start);
  const wk = workoutItems(v).filter(i => i.start != null);
  if (!ids.length && !act.length && !wk.length) return "";
  let lo = 1440, hi = 0;
  ids.forEach(id => { lo = Math.min(lo, plan[id].start); hi = Math.max(hi, plan[id].start + plan[id].goal); });
  wk.forEach(i => { lo = Math.min(lo, i.start); hi = Math.max(hi, i.start + i.minutes); });
  act.forEach(x => { const a = minOfDay(x.start); lo = Math.min(lo, a); hi = Math.max(hi, Math.min(1440, a + x.sec / 60)); });
  lo = Math.max(0, Math.floor((lo - 30) / 60) * 60); hi = Math.min(1440, Math.ceil((hi + 30) / 60) * 60);
  let g = `<div class="tl" style="height:${hi - lo}px">`;
  for (let m = lo; m <= hi; m += 60) g += `<div class="tl-h" style="top:${m - lo}px"><span>${fmtTime(m)}</span></div>`;
  for (const id of ids) {
    const p = plan[id], done = v.done[id];
    g += `<button class="tl-b ${done ? "done" : ""}" data-act="playClass" data-id="${id}" ${S.settings.timer || isFuture() ? "disabled" : ""} style="top:${p.start - lo}px;height:${Math.max(26, p.goal)}px;background:${p.color}26;border-left-color:${p.color}">
      <b>${esc(p.name)}</b><span>${fmtTime(p.start)} – ${fmtTime(p.start + p.goal)}</span>${done ? `<i class="tl-ck">${CHECK}</i>` : ""}</button>`;
  }
  for (const i of wk) {
    g += `<button class="tl-b wk ${i.done ? "done" : ""}" data-act="${i.key === "main" ? "toggleWorkout" : "toggleExtra"}" ${isFuture() ? "disabled" : ""} style="top:${i.start - lo}px;height:${Math.max(26, i.minutes)}px;background:${WK_COLOR}26;border-left-color:${WK_COLOR}">
      <b>${esc(i.label)}</b><span>${fmtTime(i.start)} – ${fmtTime(i.start + i.minutes)} · workout</span>${i.done ? `<i class="tl-ck">${CHECK}</i>` : ""}</button>`;
  }
  for (const x of act) {
    const a = minOfDay(x.start), c = classById(x.classId)?.color || "#5B6B7B";
    g += `<div class="tl-s" title="${esc(className(x.classId))}, ${fmtMin(x.sec / 60)}" style="top:${a - lo}px;height:${Math.max(4, x.sec / 60)}px;background:${c}"></div>`;
  }
  return g + `</div><p class="legend" style="margin:6px 0 10px"><span>Left: planned (tap a class to start the timer, a workout to check it off)</span><span>Right: when you actually studied</span></p>`;
}

function studyPanel(ds, v) {

function weightChart(ws) {
  if (ws.length < 2) return `<p class="empty">Add at least two weigh-ins to see the trend.</p>`;
  const W = 320, H = 140, pl = 36, pr = 10, pt = 10, pb = 22;
  const xs = ws.map(w => parse(w.date).getTime()), ys = ws.map(w => w.value);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), sp = (y1 - y0) || 1, lo = y0 - sp * .15, hi = y1 + sp * .15;
  const X = t => pl + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - pl - pr), Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const path = ws.map((w, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    <line x1="${pl}" x2="${W - pr}" y1="${Y(y1)}" y2="${Y(y1)}"/><line x1="${pl}" x2="${W - pr}" y1="${Y(y0)}" y2="${Y(y0)}"/>
    <text x="${pl - 4}" y="${Y(y1) + 3}" text-anchor="end">${y1}</text><text x="${pl - 4}" y="${Y(y0) + 3}" text-anchor="end">${y0}</text>
    <path class="ln" d="${path}"/>${ws.map((w, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3"/>`).join("")}
    <text x="${pl}" y="${H - 6}">${shortDate(ws[0].date)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${shortDate(ws[ws.length - 1].date)}</text></svg>`;
}

const dayEdit = (fn, wk = false) => updateDay(S.selDate, d => { if (wk) d.customWk = true; else d.custom = true; fn(d); layoutPlan(d.snap.plan, fixedBlocks(d.snap.workout, d.extra)); });
function editVac(id, fn) { const vs = structuredClone(S.settings.vacations), v = vs.find(x => x.id === id); if (!v) return; fn(v); commitSettings({ vacations: vs }); }
function editClass(id, fn) { const cl = structuredClone(S.settings.classes), c = cl.find(x => x.id === id); if (!c) return; fn(c); commitSettings({ classes: cl }); }
function editWorkout(fn) { const w = structuredClone(S.settings.workout); w.plan = w.plan || {}; fn(w); commitSettings({ workout: w }); }
function editCal(fn) { const c = structuredClone(S.settings.calories); c.limits = c.limits || {}; fn(c); commitSettings({ calories: c }); }
function editExam(id, fn) { const ex = structuredClone(S.settings.exams), e = ex.find(x => x.id === id); if (!e) return; fn(e); commitSettings({ exams: ex }); }
function calStep(n) {
  const c = S.cal, d = parse(c.cursor);
  if (c.mode === "week") c.cursor = addDays(c.cursor, 7 * n);
  else if (c.mode === "month") c.cursor = dstr(new Date(d.getFullYear(), d.getMonth() + n, 1));
  else c.cursor = dstr(new Date(d.getFullYear() + n, 0, 1));
  render();
}
const needDays = k => { if (!S.bulk[k].length) { toast("Pick at least one day first"); return false; } return true; };

const ACT = {
  signIn: () => store.signIn(),
  signOut: () => { stopSub(); store.signOut(); },
  tab: el => { S.tab = el.dataset.tab; S.editPlan = false; render(); scrollTo(0, 0); },
  prevDay: () => { S.selDate = addDays(S.selDate, -1); S.editPlan = false; render(); },
  nextDay: () => { if (S.selDate < addDays(todayStr(), 365)) { S.selDate = addDays(S.selDate, 1); S.editPlan = false; render(); } },
  goToday: () => { S.selDate = todayStr(); S.editPlan = false; render(); },
  openDay: el => { S.selDate = el.dataset.date; S.tab = "today"; S.editPlan = false; render(); scrollTo(0, 0); },
  openMonth: el => { S.cal = { mode: "month", cursor: el.dataset.date }; render(); },
  calMode: el => { S.cal.mode = el.dataset.mode; render(); },
  calPrev: () => calStep(-1), calNext: () => calStep(1),

  toggleClass: el => updateDay(S.selDate, d => { d.done[el.dataset.id] = !d.done[el.dataset.id]; }),
  playClass: el => { startTimer(el.dataset.id); },
  startTimerSel: () => { const sel = $("#timerClass"); if (sel?.value) startTimer(sel.value); },
  stopTimer: () => stopTimer(),
  addMin: el => {
    const m = parseFloat(prompt("Minutes to add?", "30"));
    if (!(m > 0)) return;
    const ds = S.selDate, start = ds === todayStr() ? Date.now() : parse(ds).getTime() + 12 * 3600e3;
    updateDay(ds, d => addSession(d, { classId: el.dataset.id, start, sec: Math.round(m * 60), manual: true }));
  },
  delSession: el => updateDay(S.selDate, d => { d.sessions = d.sessions.filter(x => x.id !== el.dataset.id); }),
  openMove: () => { S.moveFor = S.selDate; render(); },
  cancelMove: () => { S.moveFor = null; render(); },
  confirmMove: async () => {
    const src = S.selDate, to = $("#moveTo")?.value, v = dayView(src);
    if (!to || !v.snap.workout || v.moved || src < todayStr()) return;
    if (moveUsedInWeek(src)) { toast("You've already used this week's rest-day move"); return; }
    const mv = { label: v.snap.workout.label, minutes: v.snap.workout.minutes, start: v.snap.workout.start ?? null };
    S.moveFor = null;
    await updateDay(src, d => { d.moved = { to, ...mv }; });
    await updateDay(to, d => { d.extra = { from: src, ...mv, done: false, note: "" }; });
    toast(`Workout moved to ${wkdayName(to)}`);
  },
  undoMove: async el => {
    const src = el.dataset.src, sd = S.days[src]; if (!sd?.moved) return;
    const to = sd.moved.to;
    if (src < todayStr()) { toast("That day has passed, so the move can't be undone"); return; }
    if (S.days[to]?.extra?.done) { toast("That workout is already done, so it can't be moved back"); return; }
    await updateDay(src, d => { delete d.moved; });
    await updateDay(to, d => { delete d.extra; });
  },
  toggleExtra: () => updateDay(S.selDate, d => { if (d.extra) d.extra.done = !d.extra.done; }),
  toggleEdit: () => { S.editPlan = !S.editPlan; render(); },
  dayRemove: el => dayEdit(d => { delete d.snap.plan[el.dataset.id]; }),
  dayAdd: () => {
    const id = $("#dayAddSel")?.value, c = classById(id); if (!c) return;
    dayEdit(d => { d.snap.plan[id] = { name: c.name, color: c.color, goal: c.minutes > 0 ? c.minutes : 30, start: null, pin: false, exam: null, adjusted: false }; });
  },
  dayReset: () => updateDay(S.selDate, d => { const ms = makeSnap(S.selDate); d.custom = false; d.customWk = false; d.snap.plan = ms.plan; d.snap.workout = ms.workout; }),
  dayWkAdd: () => dayEdit(d => { d.snap.workout = { label: "Workout", minutes: 30, start: null }; }, true),
  dayWkRemove: () => dayEdit(d => { d.snap.workout = false; }, true),
  vacNewToggle: el => { S.vacNew[el.dataset.k] = !S.vacNew[el.dataset.k]; render(); },
  vacToggle: el => editVac(el.dataset.id, v => { v.absent = v.absent || {}; v.absent[el.dataset.k] = !v.absent[el.dataset.k]; }),
  addVac: () => {
    const start = $("#vacStart").value, end = $("#vacEnd").value || start, name = $("#vacName").value.trim(), a = S.vacNew;
    if (!start) { toast("Pick the first day"); return; }
    if (end < start) { toast("The last day can't be before the first day"); return; }
    if (!a.study && !a.workout && !a.cal) { toast("Choose at least one goal to be absent"); return; }
    $("#vacName").value = ""; $("#vacStart").value = ""; $("#vacEnd").value = "";
    commitSettings({ vacations: [...S.settings.vacations, { id: uid(), name: name || "Time away", start, end, absent: { ...a } }] });
  },
  delVac: el => commitSettings({ vacations: S.settings.vacations.filter(v => v.id !== el.dataset.id) }),

  toggleWorkout: () => updateDay(S.selDate, d => { d.workout.done = !d.workout.done; }),
  addCal: () => {
    const kcal = Math.round(parseFloat($("#calKcal").value)); const label = $("#calLabel").value.trim();
    if (!(kcal > 0)) { toast("Enter calories as a number"); return; }
    $("#calKcal").value = ""; $("#calLabel").value = "";
    updateDay(S.selDate, d => { d.cal.entries.push({ id: uid(), label, kcal }); });
  },
  delCal: el => updateDay(S.selDate, d => { d.cal.entries = d.cal.entries.filter(x => x.id !== el.dataset.id); }),
  toggleCalOk: () => updateDay(S.selDate, d => { d.cal.ok = !d.cal.ok; }),

  addClass: () => {
    const name = $("#newClass").value.trim(); if (!name) { toast("Type a class name first"); return; }
    $("#newClass").value = "";
    const used = S.settings.classes.map(c => c.color), color = COLORS.find(c => !used.includes(c)) || COLORS[S.settings.classes.length % COLORS.length];
    commitSettings({ classes: [...S.settings.classes, { id: uid(), name, color, minutes: 45, days: [1, 2, 3, 4, 5], start: "" }] });
  },
  delClass: el => {
    const c = classById(el.dataset.id); if (!c || !confirm(`Delete ${c.name}? Past study logs stay in your history.`)) return;
    commitSettings({ classes: S.settings.classes.filter(x => x.id !== c.id) });
  },
  clsMove: el => {
    const cl = [...S.settings.classes], i = cl.findIndex(c => c.id === el.dataset.id), j = i + +el.dataset.dir;
    if (i < 0 || j < 0 || j >= cl.length) return; [cl[i], cl[j]] = [cl[j], cl[i]]; commitSettings({ classes: cl });
  },
  toggleClsDay: el => editClass(el.dataset.id, c => { const d = +el.dataset.d; c.days = c.days.includes(d) ? c.days.filter(x => x !== d) : [...c.days, d].sort(); }),
  toggleGoal: el => { const g = el.dataset.g; commitSettings({ [g]: { ...S.settings[g], enabled: !S.settings[g].enabled } }); },
  toggleExamBoost: () => commitSettings({ examBoost: S.settings.examBoost === false }),

  bulkDay: el => { const k = el.dataset.kind, d = +el.dataset.d, a = S.bulk[k]; S.bulk[k] = a.includes(d) ? a.filter(x => x !== d) : [...a, d].sort(); render(); },
  bulkPreset: el => { S.bulk[el.dataset.kind] = { weekdays: [1, 2, 3, 4, 5], weekend: [0, 6], all: [0, 1, 2, 3, 4, 5, 6], none: [] }[el.dataset.p]; render(); },
  bulkWkApply: () => {
    if (!needDays("wk")) return;
    const days = S.bulk.wk, start = $("#bulkWkStart").value || "", label = $("#bulkWkLabel").value.trim() || "Workout", minutes = Math.max(0, Math.round(+$("#bulkWkMin").value || 0));
    if (!minutes) { toast("Enter minutes (0 would make these rest days)"); return; }
    editWorkout(w => days.forEach(d => { w.plan[d] = { label, minutes, start }; })); toast(`Workout set for ${days.length} day${days.length === 1 ? "" : "s"}`);
  },
  bulkWkRest: () => { if (needDays("wk")) editWorkout(w => S.bulk.wk.forEach(d => { delete w.plan[d]; })); },
  wkAdd: el => editWorkout(w => { w.plan[el.dataset.d] = { label: "Workout", minutes: 30, start: "" }; }),
  wkRest: el => editWorkout(w => { delete w.plan[el.dataset.d]; }),
  bulkCalApply: () => {
    if (!needDays("cal")) return;
    const raw = $("#bulkCal").value, k = Math.round(+raw);
    if (raw === "" || !(k >= 0)) { toast("Enter a calorie limit (0 = no goal)"); return; }
    editCal(c => S.bulk.cal.forEach(d => { c.limits[d] = k; })); toast(`Limit set for ${S.bulk.cal.length} day${S.bulk.cal.length === 1 ? "" : "s"}`);
  },
  bulkCalClear: () => { if (needDays("cal")) editCal(c => S.bulk.cal.forEach(d => { delete c.limits[d]; })); },
  calReset: el => editCal(c => { delete c.limits[el.dataset.d]; }),

  addExam: () => {
    const date = $("#exDate").value, classId = $("#exClass").value; let name = $("#exName").value.trim();
    if (!date) { toast("Pick the exam date"); return; }
    if (!name) name = classId ? `${className(classId)} exam` : "Exam";
    $("#exName").value = ""; $("#exDate").value = "";
    commitSettings({ exams: [...S.settings.exams, { id: uid(), classId, name, date, steps: structuredClone(STD_STEPS), score: null, max: 100 }] });
  },
  delExam: el => { const e = S.settings.exams.find(x => x.id === el.dataset.id); if (e && confirm(`Delete ${e.name}? Its score goes with it.`)) commitSettings({ exams: S.settings.exams.filter(x => x.id !== e.id) }); },
  addStep: el => editExam(el.dataset.id, e => { e.steps = [...(e.steps || []), { within: 7, mode: "+", value: 15 }]; }),
  delStep: el => editExam(el.dataset.id, e => { e.steps.splice(+el.dataset.i, 1); }),
  stepTemplate: el => editExam(el.dataset.id, e => { e.steps = structuredClone({ std: STD_STEPS, plus: PLUS_STEPS, none: [] }[el.dataset.t]); }),

  addWeight: () => {
    const date = $("#wDate").value, value = num($("#wVal").value);
    if (!date || value == null || value <= 0) { toast("Enter a date and a weight"); return; }
    $("#wVal").value = "";
    commitSettings({ weights: [...S.settings.weights.filter(w => w.date !== date), { id: uid(), date, value }].sort((a, b) => a.date < b.date ? -1 : 1) });
  },
  delWeight: el => commitSettings({ weights: S.settings.weights.filter(w => w.id !== el.dataset.id) }),

  copySummary: async () => { try { await navigator.clipboard.writeText(weekSummary(weekDates())); toast("Summary copied"); } catch { toast("Couldn't copy. Select the text instead."); } },
  emailSummary: () => {
    const d = weekDates(), to = encodeURIComponent(S.settings.summaryEmail || "");
    location.href = `mailto:${to}?subject=${encodeURIComponent(`Tally weekly summary, ${shortDate(d[0])} – ${shortDate(d[6])}`)}&body=${encodeURIComponent(weekSummary(d))}`;
  },
  exportData: () => {
    const blob = new Blob([JSON.stringify({ settings: S.settings, days: S.days }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `tally-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
};
const CHG = {
  extraNote: el => updateDay(S.selDate, d => { if (d.extra) d.extra.note = el.value.trim(); }),
  workoutNote: el => updateDay(S.selDate, d => { d.workout.note = el.value.trim(); }),
  clsName: el => editClass(el.dataset.id, c => { c.name = el.value.trim() || c.name; }),
  clsColor: el => editClass(el.dataset.id, c => { c.color = el.value; }),
  clsMin: el => editClass(el.dataset.id, c => { c.minutes = Math.max(0, Math.round(+el.value || 0)); }),
  clsStart: el => editClass(el.dataset.id, c => { c.start = el.value; }),
  studyStart: el => commitSettings({ studyStart: el.value }),
  breakMin: el => commitSettings({ breakMin: Math.max(0, Math.round(+el.value || 0)) }),
  summaryEmail: el => { S.settings.summaryEmail = el.value.trim(); store.saveSettings({ summaryEmail: S.settings.summaryEmail }); },
  wkStart: el => editWorkout(w => { if (w.plan[el.dataset.d]) w.plan[el.dataset.d].start = el.value; }),
  dayWkMin: el => { const m = Math.max(0, Math.round(+el.value || 0)); dayEdit(d => { if (!d.snap.workout) return; if (m > 0) d.snap.workout.minutes = m; else d.snap.workout = false; }, true); },
  dayWkStart: el => dayEdit(d => { if (d.snap.workout) d.snap.workout.start = hm(el.value); }, true),
  vacLabel: el => editVac(el.dataset.id, v => { v.name = el.value.trim() || "Time away"; }),
  vacFrom: el => editVac(el.dataset.id, v => { if (el.value) { v.start = el.value; if (v.end < v.start) v.end = v.start; } }),
  vacTo: el => editVac(el.dataset.id, v => { if (el.value) { v.end = el.value; if (v.end < v.start) v.start = v.end; } }),
  wkLabel: el => editWorkout(w => { if (w.plan[el.dataset.d]) w.plan[el.dataset.d].label = el.value.trim() || "Workout"; }),
  wkMin: el => editWorkout(w => { const m = Math.max(0, Math.round(+el.value || 0)); if (!w.plan[el.dataset.d]) return; if (m > 0) w.plan[el.dataset.d].minutes = m; else delete w.plan[el.dataset.d]; }),
  calDay: el => editCal(c => { if (el.value === "") delete c.limits[el.dataset.d]; else c.limits[el.dataset.d] = Math.max(0, Math.round(+el.value || 0)); }),
  calLimit: el => commitSettings({ calories: { ...S.settings.calories, limit: Math.max(0, Math.round(+el.value || 0)) } }),
  dayMin: el => { const m = Math.max(0, Math.round(+el.value || 0)); dayEdit(d => { if (!d.snap.plan[el.dataset.id]) return; if (m > 0) d.snap.plan[el.dataset.id].goal = m; else delete d.snap.plan[el.dataset.id]; }); },
  dayStart: el => dayEdit(d => { const p = d.snap.plan[el.dataset.id]; if (!p) return; const m = hm(el.value); p.pin = m != null; p.start = m; }),
  examName: el => editExam(el.dataset.id, e => { e.name = el.value.trim() || e.name; }),
  examScore: el => editExam(el.dataset.id, e => { e.score = el.value === "" ? null : num(el.value); }),
  examMax: el => editExam(el.dataset.id, e => { const m = num(el.value); e.max = m > 0 ? m : 100; }),
  stepWithin: el => editExam(el.dataset.id, e => { e.steps[+el.dataset.i].within = Math.max(0, Math.round(+el.value || 0)); }),
  stepMode: el => editExam(el.dataset.id, e => { e.steps[+el.dataset.i].mode = el.value; }),
  stepValue: el => editExam(el.dataset.id, e => { e.steps[+el.dataset.i].value = Math.max(0, num(el.value) ?? 0); }),
  weightUnit: el => commitSettings({ weightUnit: el.value })
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) ACT[el.dataset.act]?.(el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-chg]"); if (el) CHG[el.dataset.chg]?.(el); });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "calKcal" || e.target.id === "calLabel") ACT.addCal();
  else if (e.target.id === "wVal") ACT.addWeight();
});
let tx = null, ty = null;
document.addEventListener("touchstart", e => {
  tx = S.tab === "today" && e.touches.length === 1 && !e.target.closest("input,select,textarea") ? e.touches[0].clientX : null; ty = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (tx == null) return; const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = null;
  if (Math.abs(dx) > 80 && Math.abs(dy) < 40) (dx < 0 ? ACT.nextDay : ACT.prevDay)();
}, { passive: true });
document.addEventListener("keydown", e => {
  if (S.tab !== "today" || e.target.closest?.("input,select,textarea")) return;
  if (e.key === "ArrowRight") ACT.nextDay(); else if (e.key === "ArrowLeft") ACT.prevDay();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.lastToday !== todayStr()) { S.lastToday = todayStr(); S.selDate = todayStr(); render(); }
});
S.lastToday = todayStr();

/* ============================================================
   9. Boot
   ============================================================ */
function stopSub() { S.unsub?.(); S.unsub = null; S.loaded = { s: false, d: false }; S.seeded = false; S.days = {}; }
function startData() {
  stopSub();
  S.unsub = store.start(
    r => {
      if (r === null && !S.seeded) { S.seeded = true; const d = defaultSettings(); store.saveSettings(d); S.settings = d; }
      else {
        S.settings = mergeSettings(r);
        if (r && !r.exams && S.settings.exams.length) store.saveSettings({ exams: S.settings.exams });   // persist migrated exams once
      }
      S.loaded.s = true; render();
    },
    d => { S.days = d; S.loaded.d = true; render(); }
  );
}
if (store.mode === "local") startData();
else store.onAuth(u => {
  $("#auth").classList.toggle("hidden", !!u);
  if (u) startData(); else stopSub();
});
</script>
</body>
</html>
